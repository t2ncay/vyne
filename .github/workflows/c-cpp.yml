name: Vyne CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master", "feat/**", "fix/**"]

jobs:
  test-suite:
    name: ${{ matrix.build_type }} Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Performance, Memory-Safety]
        include:
          - build_type: Performance
            flags: "-O3"
          - build_type: Memory-Safety
            flags: "-g -fsanitize=address -fsanitize=undefined"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          set -euo pipefail

          # The hosted ubuntu-24.04 image already ships g++-13,
          # libstdc++-13-dev, libssl-dev, pkg-config, and git. The host
          # build below only needs g++-13 plus OpenSSL headers/libs.
          #
          # apt is best-effort on purpose: Azure-hosted runners
          # intermittently fail to resolve azure.archive.ubuntu.com (and
          # archive/security.ubuntu.com), which makes both `apt-get
          # update` and `apt-get install` die with exit 100 before the
          # compiler ever runs. Check for the real requirements first and
          # skip apt entirely when they are already satisfied.
          have_deps() {
            command -v g++-13 >/dev/null 2>&1 &&
              command -v pkg-config >/dev/null 2>&1 &&
              test -f /usr/include/openssl/ssl.h &&
              pkg-config --exists openssl
          }

          if have_deps; then
            echo "Build dependencies already present; skipping apt."
            g++-13 -dumpversion
            exit 0
          fi

          for attempt in 1 2 3; do
            if sudo apt-get update \
                 -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=15 \
                 -o Acquire::https::Timeout=15; then
              break
            fi
            echo "apt-get update failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done

          set +e
          sudo apt-get install -y --no-install-recommends \
            g++-13 libstdc++-13-dev libssl-dev pkg-config
          install_rc=$?
          set -e
          if [ "${install_rc}" -ne 0 ]; then
            echo "::warning::apt-get install failed (exit ${install_rc}); verifying preinstalled tools"
          fi

          # Hard requirements: fail here with a clear message if the
          # fallback path still does not have what the build needs.
          have_deps
          g++-13 -dumpversion

      - name: Compile Vyne
        run: |
          set -euo pipefail

          # Compile the application source roots, matching xmake.lua.
          # Standalone tests have their own entry points and build steps.
          mapfile -t sources < <(find main.cpp cli vyne -type f -name "*.cpp" \
              ! -path "*/build/*" \
              ! -path "*/CMakeFiles/*")
          g++-13 -std=c++23 ${{ matrix.flags }} \
              -I./editors/vscode/lsp/backend/include \
              -I./vendor \
              -I./vendor/stb \
              "${sources[@]}" \
              -o vyne_run \
              -lm -lpthread -ldl -lrt -lssl -lcrypto

      - name: Run hardware configuration and initialization acceptance
        env:
          VYNEC: ./vyne_run
        run: python3 scripts/test_hardware.py

      - name: Run discarded zero-argument native call regression
        run: |
          set -euo pipefail
          ./vyne_run --compile -o native_zero_test examples/transpiler/native_zero_side_effects.vy
          ./native_zero_test

      - name: Run host touch calibration regression
        run: |
          set -euo pipefail
          g++-13 -std=c++23 ${{ matrix.flags }} -Wall -Wextra \
              scripts/tests/esp32_touch_calibration.cpp \
              -o esp32_touch_calibration_test
          ./esp32_touch_calibration_test
