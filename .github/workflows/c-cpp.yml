name: Vyne CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-suite:
    name: ${{ matrix.build_type }} Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Performance, Memory-Safety]
        include:
          - build_type: Performance
            flags: "-O3"
          - build_type: Memory-Safety
            flags: "-g -fsanitize=address -fsanitize=undefined"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git g++-13 libstdc++-13-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev xvfb

      - name: Build Raylib from Source
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib_src
          mkdir raylib_src/build && cd raylib_src/build
          cmake .. -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF -DSHARED=OFF
          make -j$(nproc)
          sudo make install

      - name: Compile Vyne
        run: |
          g++-13 -std=c++23 ${{ matrix.flags }} \
              -I./editors/vscode/lsp/backend/include \
              -I./vendor/stb \
              $(find . -type f -name "*.cpp" ! -path "./raylib_src/*" ! -path "*/build/*" ! -path "*/CMakeFiles/*") \
              -o vyne_run \
              -lraylib -lGL -lm -lpthread -ldl -lrt -lX11

      - name: Run Tests with Virtual Display
        run: |
          find tests -type f -name "*.vy" \
            ! -path "tests/dsp/*" \
            ! -path "tests/graphics/*"
            ! -path "tests/network/*" | while read -r testfile; do
              echo "::group::Testing $testfile"
              xvfb-run --auto-servernum ./vyne_run --ast "$testfile" || { echo "$testfile failed!"; exit 1; }
              echo "::endgroup::"
          done
