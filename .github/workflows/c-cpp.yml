name: Vyne CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-suite:
    name: ${{ matrix.build_type }} Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Performance, Memory-Safety]
        include:
          - build_type: Performance
            flags: "-O3"
          - build_type: Memory-Safety
            flags: "-g -fsanitize=address -fsanitize=undefined"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git g++-13 libstdc++-13-dev \
            libssl-dev pkg-config

      - name: Compile Vyne
        run: |
          # Host build. Excludes:
          #   ./vendor/arduino/* — AVR-target sources (avr/pgmspace.h,
          #                        avr/interrupt.h, its own main.cpp).
          #                        Built by avr-gcc under `--arduino`,
          #                        not by g++-13.
          #   */build/*          — CMake artifacts
          #   */CMakeFiles/*     — CMake artifacts
          g++-13 -std=c++23 ${{ matrix.flags }} \
              -I./editors/vscode/lsp/backend/include \
              -I./vendor \
              -I./vendor/stb \
              $(find . -type f -name "*.cpp" \
                  ! -path "./vendor/arduino/*" \
                  ! -path "*/build/*" \
                  ! -path "*/CMakeFiles/*") \
              -o vyne_run \
              -lm -lpthread -ldl -lrt -lssl -lcrypto
