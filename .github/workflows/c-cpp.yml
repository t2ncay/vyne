name: Vyne CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-suite:
    name: ${{ matrix.build_type }} Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Performance, Memory-Safety]
        include:
          - build_type: Performance
            flags: "-O3"
          - build_type: Memory-Safety
            flags: "-g -fsanitize=address -fsanitize=undefined"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev xvfb

      - name: Build Raylib from Source
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib_src
          mkdir raylib_src/build && cd raylib_src/build
          cmake .. -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF
          make -j$(nproc)
          sudo make install
          # İndi Raylib /usr/local/lib və /usr/local/include qovluqlarındadır

      - name: Create STB Implementation
        run: |
          echo '#define STB_IMAGE_IMPLEMENTATION' > stb_impl.cpp
          echo '#include "vendor/stb/stb_image.h"' >> stb_impl.cpp

      - name: Compile Vyne
        run: |
          g++ -std=c++23 ${{ matrix.flags }} \
              -I./editors/vscode/lsp/backend/include \
              -I./vendor/stb \
              $(find . -name "*.cpp") \
              -o vyne_run \
              -lraylib -lGL -lm -lpthread -ldl -lrt -lX11

      - name: Run Tests with Virtual Display
        run: |
          for testfile in tests/*.vy; do
            if [ -f "$testfile" ]; then
              echo "::group::Testing $testfile"
              xvfb-run --auto-servernum ./vyne_run --ast "$testfile" || { echo "$testfile failed!"; exit 1; }
              echo "::endgroup::"
            fi
          done
