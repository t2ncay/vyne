name: Vyne CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-suite:
    name: ${{ matrix.build_type }} Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Performance, Memory-Safety]
        include:
          - build_type: Performance
            flags: "-O3"
          - build_type: Memory-Safety
            flags: "-g -fsanitize=address -fsanitize=undefined"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Raylib və sistem asılılıqlarını quraşdırırıq
          sudo apt-get install -y build-essential g++ \
            libraylib-dev libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev xvfb
      - name: Compile Vyne
        run: |
          # Linux-da link etmə qaydası fərqlidir:
          # -lraylib: Raylib özü
          # -lGL -lm -lpthread -ldl -lrt -lX11: Lazımi sistem kitabxanaları
          g++ -std=c++23 ${{ matrix.flags }} \
              -I./editors/vscode/lsp/backend/include \
              -I./vendor/stb \
              $(find . -name "*.cpp") \
              -o vyne_run \
              -lraylib -lGL -lm -lpthread -ldl -lrt -lX11

      - name: Run Tests
        run: |
          for testfile in tests/*.vy; do
            if [ -f "$testfile" ]; then
              echo "::group::Testing $testfile"
              ./vyne_run --ast "$testfile" || { echo "$testfile failed!"; exit 1; }
              echo "::endgroup::"
            fi
          done

      - name: Binary Size Report
        if: matrix.build_type == 'Performance'
        run: ls -lh vyne_run
