[project]
name = "rv_spc"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
license = "AGPL-3.0-only"
description = "A Vyne project"
repository = ""
keywords = []

[toolchain]
vyne = "0.4.0"

[dependencies]
vml = "0.4"
vfft = "0.4"
vcomplex = "0.4"

[targets]
default = "arduino-uno"

[targets.arduino-uno]
backend = "avr"
board = "arduino:avr:uno"

[build]
default_targets = ["arduino-uno"]
deterministic = true

[test]
discovery = "tests/*.vy"
snapshot_format = "json"

[bench]
warmup = 10
iterations = 100
report = "build/bench.json"
